name: 功能建议
description: 提出新功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: 请描述你希望解决的实际问题，而不只是实现方案，便于判断优先级。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便 / 缺什么
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的实现方式
      description: 界面怎么放、交互怎么走、生成什么脚本
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考的模组 / 文档 / 截图等
    validations:
      required: false
