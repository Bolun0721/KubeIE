name: Release

# 推送 v* 标签时自动打包 Windows 安装包 / 便携包，并创建草稿 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验
        run: |
          npm run typecheck
          npm test

      - name: 打包（安装包 + 便携 zip）
        # GitHub 的 windows runner 有创建符号链接的权限，winCodeSign 可正常解压，
        # 因此这里通过 CLI 覆盖打开 exe 图标与资源改写（本地打包默认关闭，见 electron-builder.yml）。
        run: >
          npx electron-builder --win --config electron-builder.yml --publish never
          -c.win.icon=assets/icon.ico
          -c.win.signAndEditExecutable=true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KubeIE-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
